<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Selection Menu</title>
    <!-- 1. Load Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- 3. Load Neumorphic CSS (using detector.css for consistent button/card styling) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='detector.css') }}">
</head>
<body class="min-h-screen flex justify-center items-start p-4 pt-10">
    
    <!-- Use the main-card class to get the Neumorphic outer shadow -->
    <div class="main-card max-w-xl w-full p-8 md:p-12 text-center">
        
        <header class="mb-8 border-b pb-3">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-4">Content Selection</h1>
            <h2 class="text-xl text-gray-600">Emotion Detected: <span class="uppercase font-bold text-indigo-600">{{ emotion }}</span></h2>
        </header>

        <p class="text-lg text-gray-700 mb-8">
            What kind of positive boost would you like? Select one option:
        </p>
        
        <!-- Button Group for Content Options -->
        <div class="flex flex-col space-y-4">
            
            <!-- Option 1: Songs -->
            <!-- Link sends the content_type 'songs' to the recommendations route -->
            <a href="{{ url_for('recommendations', content_type='songs') }}" 
               class="cta-button text-indigo-700 font-bold py-4 px-6 rounded-xl text-lg hover:bg-indigo-50">
                🎵 Song Recommendations
            </a>
            
            <!-- Option 2: Videos -->
            <a href="{{ url_for('recommendations', content_type='videos') }}" 
               class="cta-button text-green-700 font-bold py-4 px-6 rounded-xl text-lg hover:bg-green-50">
                🎬 Video Suggestions
            </a>

            <!-- Option 3: Mudras -->
            <a href="{{ url_for('recommendations', content_type='mudras') }}" 
               class="cta-button text-amber-700 font-bold py-4 px-6 rounded-xl text-lg hover:bg-amber-50">
                🙏 Acupressure Mudras
            </a>
            
            <!-- Option 4: Quotes -->
            <a href="{{ url_for('recommendations', content_type='quotes') }}" 
               class="cta-button text-purple-700 font-bold py-4 px-6 rounded-xl text-lg hover:bg-purple-50">
                💬 Motivational Quotes
            </a>
        </div>
        
        <div class="mt-8">
            <a href="{{ url_for('detector') }}" class="text-gray-500 hover:text-gray-700 underline text-sm transition duration-150">
                Rerun Emotion Detector
            </a>
        </div>
    </div>

</body>
</html>
