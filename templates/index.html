<html>

<head>
    <title>Emotion Music Recommendation</title>

    <style>
        /* CSS to hide the float: left logic and use modern layout */
        /* Removed width: 51% from #video-container, letting the parent div manage it */
        #video-container {
            margin: 10px;
            text-align: center;
            /* width: 51%; REMOVED */
            /* display: inline-block; REMOVED */
        }
        /* Ensure the image scales correctly within its new container */
        #bg {
            padding: 20px;
            display: block; 
            margin: auto;
            width: 85%;
            display: none; 
            /* Added explicit max-width and height for responsiveness */
            max-width: 90%; 
            height: auto;
        }
        img {
            padding: 20px;
            display: inline-block;
            margin: auto;
            width: 85%;
        }
        .outer-shadow {
             box-shadow: 5px 5px 10px #bebebe, -5px -5px 10px #ffffff;
             border-radius: 15px;
        }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Bigelow+Rules&display=swap" rel="stylesheet">
    <link type="text/css" href="{{ url_for('static', filename='/css/style.css') }}" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf"
        crossorigin="anonymous"></script>
</head>

<body style="margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: #eff0f4">

    <div id="body" style="width: 95%; margin: auto;">

        <div>
            <h1 align="center" style="
                font-family: 'Bigelow Rules';
                font-size: 72px;
                color: #0ccac4;">
                Mood Music Recommender
            </h1>
        </div>

        <div style="display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;">

            <div style="
                flex: 1; /* Allows this div to grow/shrink based on screen size */
                min-width: 450px; /* Ensures it doesn't get too small */
                height: 100%;
                margin: auto;
                padding-bottom: 25px;
                text-align: center;
            ">

                <h2 align="center" style="
                    font-family: 'Bigelow Rules';
                    font-size: 36px;
                    color: #0ccac4;">Emotion Detector
                </h2>
                
                <h3 id="emotion-status" align="center" style="color: #ff5722;">Click Start to Begin</h3>
                <div id="video-container"> 
                    <img class="outer-shadow center img-fluid" id="bg" alt="Webcam Feed" src="" />
                </div>
                
                <div id="control-buttons">
                    <button class="btn btn-primary outer-shadow" onclick="startDetection()">Start Detection</button>
                    <button class="btn btn-success outer-shadow" onclick="getRecommendation()" disabled id="recommend-btn">Get Recommendation</button>
                </div>
            </div>
            
            <div style="
                flex: 1; /* Allows this div to grow/shrink based on screen size */
                min-width: 450px; /* Ensures it doesn't get too small */
                height: 100%;
                margin: auto;
                text-align: center;
            ">

                <h2 align="center" style="
                    font-family: 'Bigelow Rules';
                    font-size: 36px;
                    color: #0ccac4;">Song Recommendations
                </h2>
                
                <div class="outer-shadow" id="ResultArea" style="
                    padding: 15px;
                    width: 95%;
                    margin: 10px auto;
                    height: auto;
                    min-height: 400px; /* Added for better vertical placement */
                    text-align: center;
                    margin-bottom: 15px;
                ">
                    <p>Recommendations will appear here after detection is stopped.</p>
                </div>
            </div>
        </div>
        </div>

</body>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script type=text/javascript>
    let is_streaming = false;

    // --- Start Detection ---
    function startDetection() {
        if (is_streaming) return;

        is_streaming = true;
        
        const videoElement = document.getElementById('bg');
        videoElement.src = "{{ url_for('video_feed') }}";
        videoElement.style.display = 'block';

        document.getElementById('emotion-status').innerText = 'Detecting Emotion... Please look at the camera.';
        document.getElementById('recommend-btn').disabled = false;
        document.getElementById('control-buttons').querySelector('button:first-child').disabled = true;

        $("#ResultArea").html("<p>Recommendations will appear here after detection is stopped.</p>");
    }

    // --- Stop Detection & Get Recommendation ---
    function getRecommendation() {
        if (!is_streaming) return;
        
        is_streaming = false;
        
        document.getElementById('recommend-btn').disabled = true;
        document.getElementById('emotion-status').innerText = 'Stopping stream... Generating recommendation...';

        fetch('/stop_detection')
            .then(response => response.json())
            .then(data => {
                const emotion = data.emotion;
                const songs = JSON.parse(data.songs);
                
                const videoElement = document.getElementById('bg');
                videoElement.src = ""; 
                videoElement.style.display = 'none';
                
                document.getElementById('emotion-status').innerText = `Final Emotion: ${emotion}`;

                CreateHtmlTable(songs, emotion);

                document.getElementById('control-buttons').querySelector('button:first-child').disabled = false;
            })
            .catch(error => {
                console.error('Error fetching recommendation:', error);
                document.getElementById('emotion-status').innerText = 'Error: Could not get recommendation.';
                document.getElementById('control-buttons').querySelector('button:first-child').disabled = false;
            });
    }

    // --- MODIFIED FUNCTION: Creates the table with clickable links ---
    function CreateHtmlTable(data) {
        $("#ResultArea").html("");
        
        var table = $("<table class='table table-striped table-light table-bordered table-hover table-sm table-responsive' id=DynamicTable></table>").appendTo("#ResultArea");
        
        var rowHeader = $("<tr></tr>").appendTo(table);
        $("<th></th>").text("Name").appendTo(rowHeader);
        $("<th></th>").text("Album").appendTo(rowHeader);
        $("<th></th>").text("Artist").appendTo(rowHeader);
        
        $.each(data, function (i, value) {
            var row = $("<tr></tr>").appendTo(table);
            
            // --- NEW: Create a clickable link for the song Name ---
            // Assuming value.URL is correct from our previous debugging
            var songLink = $('<a></a>')
                .attr('href', value.URL) // Use the new 'URL' field
                .attr('target', '_blank') // Opens link in a new tab
                .text(value.Name); 
            
            // Append the link to the Name cell
            $("<td></td>").append(songLink).appendTo(row);
            // --- END NEW CODE ---
            
            $("<td></td>").text(value.Album).appendTo(row);
            $("<td></td>").text(value.Artist).appendTo(row);
        });
    }
</script>

</html>
